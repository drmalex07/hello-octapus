apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helloworld
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "10"
    cert-manager.io/cluster-issuer: letsencrypt-http01-staging-issuer
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - helloworld.example.com
    secretName: helloworld-tls
  rules:
  - host: helloworld.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: 
            name: helloworld
            port:
              number: 8080

