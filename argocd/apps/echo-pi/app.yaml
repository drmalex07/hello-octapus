apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: echo-pi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "35"
spec:
  project: default
  sources:
  - repoURL: https://github.com/drmalex07/hello-octapus 
    path: deploy/echo-pi
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
